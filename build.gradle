plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// 构建轮次 -rN 只用于本机测试 jar 的文件名（成品\测试版本）：写在 round.properties（mod_round=N）；
// 没有这个文件时 jar 不带 -rN。模组内部显示的版本号不带 rN。
def roundFile = file('round.properties')
def roundProps = new Properties()
if (roundFile.exists()) { roundFile.withInputStream { roundProps.load(it) } }
def modRound = roundProps.getProperty('mod_round', '').trim()
version = modRound ? "${mod_version}-r${modRound}" : mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

neoForge {
    version = project.neo_version
    runs { server { server(); programArgument '--nogui' } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // NeoForge 运行时自带 Sponge Mixin，这里只需编译期可见
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    def props = [minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
                 loader_version_range: loader_version_range, mod_version: mod_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
